[package]
name = "avm-plugin-java"
version = "0.1.2"
edition = "2021"
description = "avm native provider for OpenJDK (Eclipse Temurin via the foojay Disco API). Speaks avm's plugin protocol (https://github.com/PrajaNova/avm)."
license = "MIT"
repository = "https://github.com/PrajaNova/avm-plugin-java"

[dependencies]
avm-plugin-api = { git = "https://github.com/PrajaNova/avm" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wait-timeout = "0.2"
